<VirtualHost *:80>
    ServerName rooms.leobrown.co.uk
    DocumentRoot /var/www/spare-room/public
    <Directory /var/www/spare-room/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://rooms.leobrown.co.uk%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/spare-room-error.log
    CustomLog ${APACHE_LOG_DIR}/spare-room-access.log combined
</VirtualHost>
