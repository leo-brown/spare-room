<VirtualHost *:443>
    ServerName rooms.leobrown.co.uk
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rooms.leobrown.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rooms.leobrown.co.uk/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 35
    LimitRequestBody 1500000
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
    ProxyPass / http://127.0.0.1:8791/
    ProxyPassReverse / http://127.0.0.1:8791/
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    ErrorLog ${APACHE_LOG_DIR}/spare-room-error.log
    CustomLog ${APACHE_LOG_DIR}/spare-room-access.log combined
</VirtualHost>
